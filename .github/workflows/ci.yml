name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: crayonlark, POSTGRES_PASSWORD: crayonlark, POSTGRES_DB: crayonlark }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U crayonlark" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://crayonlark:crayonlark@localhost:5432/crayonlark
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.13.3" }
      - name: System tools (print engine)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick potrace tesseract-ocr ghostscript libcairo2
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run playwright install --with-deps chromium
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env: { API_INTERNAL_URL: "http://127.0.0.1:9" }
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          ./scripts/gen-env.sh
          docker compose -f docker-compose.yml build
      - name: Smoke test stack
        run: |
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 300
          docker compose -f docker-compose.yml exec -T api curl -fsS http://127.0.0.1:8000/api/health
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200
