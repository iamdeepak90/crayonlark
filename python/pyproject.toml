[project]
name = "crayonlark"
version = "0.1.0"
description = "Crayonlark automation system: agents, print engine, API, bot."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "redis>=5.2",
  "celery>=5.4",
  "boto3>=1.35",
  "httpx>=0.28",
  "tenacity>=9.0",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43",
  "python-multipart>=0.0.18",
  "typer>=0.13",
  "jinja2>=3.1",
  "markdown>=3.7",
  "pillow>=11.0",
  "numpy>=2.1",
  "opencv-python-headless>=4.10",
  "reportlab>=4.2",
  "pikepdf>=9.4",
  "cairosvg>=2.7",
  "pytesseract>=0.3.13",
  "playwright>=1.49",
  "python-telegram-bot>=21.9",
  "segno>=1.6.6",
  "anthropic>=0.70",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "respx>=0.21",
  "fakeredis>=2.26",
  "types-markdown",
  "boto3-stubs[s3]",
  "celery-types",
]

[project.scripts]
crayonlark = "crayonlark.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crayonlark"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.13"
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["crayonlark.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: needs Postgres/Redis/S3 (run inside compose)",
  "tools: needs ImageMagick/potrace/tesseract (run inside the worker image)",
]
